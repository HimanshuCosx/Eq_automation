name: Daily Automation Tests

# ---------------------------------------------------------------------------
# WHEN this workflow runs
# ---------------------------------------------------------------------------
on:
  # 1) On a schedule. Cron times are in UTC (NOT your local time!).
  #    '30 4 * * 1-5'  ==  04:30 UTC  ==  10:00 IST (India, UTC+5:30).
  #    The '1-5' is the day-of-week field: Mon-Fri only (0/7=Sun, 6=Sat).
  #    Format:  minute hour day-of-month month day-of-week
  schedule:
    - cron: "30 4 * * 1-5"

  # 2) A manual "Run workflow" button in the GitHub Actions tab,
  #    so you can trigger it any time without waiting for the schedule.
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest        # GitHub gives you a fresh Linux machine
    timeout-minutes: 30

    env:
      HEADLESS: "true"            # force headless browser in CI (no screen)

    steps:
      # Step 1: copy your repository onto the runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Step 2: install Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # Step 3: install your Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: install the Playwright browser + its OS libraries
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # Step 5: run the test suite.
      #   We DON'T fail here — we save the exit code and keep going so the
      #   report still gets uploaded and emailed. The job is failed later.
      - name: Run pytest
        id: pytest
        run: |
          set +e
          pytest
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Step 6: save the HTML report so you can download it from the run page
      - name: Upload test report
        if: always()               # upload even when tests failed
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/report.html
            reports/pytest.log
          retention-days: 14

      # Step 7: email the report to you (runs whether tests passed or failed)
      - name: Email the report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Equidria Daily Test Report — ${{ job.status }}"
          to: himanshu@cosx.ai
          from: EQ Automation <${{ secrets.MAIL_USERNAME }}>
          body: |
            The daily Equidria automation run has finished.
            Job status: ${{ job.status }}
            The full HTML report is attached.
          attachments: reports/report.html

      # Step 8: NOW fail the job if any test failed, so GitHub emails you an
      #   alert too. This runs last, after the report is safely uploaded+emailed.
      - name: Report test result
        if: always()
        run: exit ${{ steps.pytest.outputs.exit_code }}
